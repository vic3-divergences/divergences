l_english:
  DVG_COMMING_SOON: "#red #b Comming Soon#!"

  ### Europe

  BOH_NATION_SELECTION_LORE: "Ever since the wars of the [concept_dvg_german_revolution], the [concept_dvg_holy_roman_empire] has fallen into a weakened and decadent state, with petty lords constantly squabbling against each other. Despite it all, Bohemia remains a powerful nation and the undisputed ruler of Central Europe, though its future is uncertain.\n\n"
  BOH_NATION_SELECTION_PATHS: "Gameplay Hints:\n    - Unify the Holy Roman Empire\n    - Form the Elbian Confederation\n    - Form Zaptoslavia"

  DUA_NATION_SELECTION_LORE: "Ruled by the Plantagenet Dynasty ever since their victory in the [concept_dvg_hundred_years_war], the [concept_dvg_dual_monarchy] is a union of two unequal partners. In the courts of Paris and Londres, the [concept_dod_anglois] boast great wealth and ambitions. Though the country boasts a powerful economy, great cultural prestige, and a massive population, all of that could be for naught if the union fails to adapt to the Modern Age.\n"
  DUA_NATION_SELECTION_PATHS: "Gameplay Hints:\n    - Embrace Anglois, English or French Culture\n    - Maintain Stability in Europe\n    - Struggle for Colonies"

  BRG_NATION_SELECTION_LORE: "Once a mere duchy, subject to the authority of the French King, [concept_dvg_burgundy] broke free and formed its own state in the aftermath of the [concept_dvg_hundred_years_war]. Since then, it has grown to become one of the most powerful countries in Europe, embracing the Protestant Reformation and the Industrial Revolution and founding a modern nation-state.\n\n" 
  BRG_NATION_SELECTION_PATHS: "Gameplay Hints:\n    - Maintain control over the Rhinish Culture\n    - Resolve conflict between Parliament and Monarchy\n    - Struggle for Colonies"

  BAV_NATION_SELECTION_LORE: "The Kingdom of Bavaria is perhaps the only real winner of the [concept_dvg_german_revolution], having confirmed its territorial gains against Austria in the 1820 [concept_dvg_treaty_of_paris]. Perhaps because of this, the country maintains one of the most organized factions of Radicalists in Germany, constantly agitating against aristocratic privilege and for national unification.\n"
  BAV_NATION_SELECTION_PATHS: "Gameplay Hints:\n    - Form the Danubian Confederation\n    - Unify Germany"

  SPA_NATION_SELECTION_LORE: "Formed from of the union of the crowns of Portugal and Castille in the 15th century, the [concept_dvg_spanish_empire] was once an unmatched force, waging conquest and spreading Catholicism across all corners of the globe. Yet the centuries since their heyday have seen Spain fall into a deep decadence, as their political scene grows increasingly unstable.\n\n"
  SPA_NATION_SELECTION_PATHS: "Gameplay Hints:\n    - Fight the Columbian Revolution\n    - Struggle for Colonies"

  ARN_NATION_SELECTION_LORE: "Instead of falling under a union with Castile the Crown of Aragon followed its own destiny and significantly expanded its Mediterranean holdings. Maintaining control over large parts of southern Italy they rival with other italian Powers to unify the devided subcontinent. Or if opportunity presents itself they might look towards the weakened [concept_dvg_spanish_empire].\n"
  ARN_NATION_SELECTION_PATHS: "Gameplay Hints:\n    - Fight over the Italian Lands\n    - Conquer Iberia\n    "

  ### Ameriga

  AMA_NATION_SELECTION_LORE: "Priding itself on being the first recognized democratic country in [concept_dvg_ameriga], Amazonie portrays itself as a beacon of liberty in the New World. Nonetheless, the country is still firmly under the control of the [concept_dvg_planteur] and struggles to deal with the 'peculiar institution' of chattel slavery which sustains its economy and permeates its social fabric.\n" 
  AMA_NATION_SELECTION_PATHS: "Gameplay Hints:\n    - Decide the future of Slavery in Amazonie\n    - Fight Lotharingia for dominance over the continent\n    - Unite the Region and forge Ameriga."

  LOT_NATION_SELECTION_LORE: "After gaining its independence from [concept_dvg_burgundy], the state of Lotharingia fell into a brutal civil war between the Fédéralistes and Unitaires. After years of conflict, the charismatic colonel Denis de Aigle managed to lead his faction to victory, establishing a personalistic dictatorship. Will the 'army with a state' of the National Liberateurs hold to become a shining example for its neighbors?, or is it doomed to collapse from corruption and nepotism?\n"
  LOT_NATION_SELECTION_PATHS: "Gameplay Hints:\n    - Survive internal Struggle\n    - Defeat Amazonie\n    - Form Ameriga" 

  BEO_NATION_SELECTION_LORE: "Beornia was founded by English settlers who travelled to [concept_dvg_ameriga] seeking to preserve their culture, far from the influence of the [concept_dod_anglois]. Being mostly agrarian, remote, and sparsely populated, it is not a particularly well-known country. Among those who are aware of its existence, it is seen as an underdeveloped backwater. However, the recently-crowned King Edward seeks to change this sordid state of affairs, proclaiming himself the harbinger of the Beornian Golden Age.\n"
  BEO_NATION_SELECTION_PATHS: "Gameplay Hints:\n    - Defeat the Incan Empire\n    - Form the Holy Britannian Empire"

  TWT_NATION_SELECTION_LORE: "Also known as the [concept_dvg_incan_empire], Tawantinsuyu survived the European conquest of [concept_dvg_ameriga], and keeps its culture and traditions intact, though its position on the world stage is fragile. As the [concept_dvg_spanish_empire] falls apart and the continent grows more volatile than ever, the Realm of the Four Corners must fulfill its grand destiny, or die trying.\n"
  TWT_NATION_SELECTION_PATHS: "Gameplay Hints:\n    - Defeat the Beornians\n    - Restore former Lands\n    - Prevent the Europeans from conquering Ameriga"

  ### Arcadia

  PLA_NATION_SELECTION_LORE: "The region of Southeastern [concept_dvg_arcadia] was first colonized by French settlers from the [concept_dvg_dual_monarchy], proving to be a highly-profitable domain sustained by the slave trade and a plantation economy. Following a succession dispute for the Plantagenat throne, the colony became an independent kingdom governed by a Plantagenat cadet branch, though it distanced itself from its former overlords, instead approaching [concept_dvg_burgundy].\n"
  PLA_NATION_SELECTION_PATHS: "Gameplay Hints:\n    - Defeat the $BLC$\n    - Resolve the Question of the Monarchy\n    - Form the great nation of Arcadia"

  CNF_NATION_SELECTION_LORE: "$CNF_FLAVOR_TEXT$\n"
  CNF_NATION_SELECTION_PATHS: "Gameplay Hints:\n    - Defeat $PLA$\n    - Unite the Federation\n    - Form the great nation of Arcadia"

  VIN_NATION_SELECTION_LORE: "$VIN_FLAVOR_TEXT$\n"
  VIN_NATION_SELECTION_PATHS: "Gameplay Hints:\n    - Defeat $SCA$\n    - Solve the question of the natives\n    - Form the great nation of Arcadia"

  QIN_NATION_SELECTION_LORE: "$QIN_FLAVOR_TEXT$\n"
  QIN_NATION_SELECTION_PATHS: "Gameplay Hints:\n    - Sustain your Independence\n    - Defeat $GCO$\n    - Exploit the riches of western Arcadia"

  GCO_NATION_SELECTION_LORE: "$GCO_FLAVOR_TEXT$\n"
  GCO_NATION_SELECTION_PATHS: "Gameplay Hints:\n   - Defeat $SPA$ and gain Independence\n   - Become the dominant power in Arcadia\n"
  
  
  ### Balkans
  HUN_TRS: "Magyar\nCrownlands"
  HUN_TRS_NATION_SELECTION_LORE: "Crownlands of Hungary were until 1820 part of [concept_dvg_rum]. After the country gained independence it has been in a perpentual regency as the Kaiser refuses to return the royal crown needed for crowning a King. Current King-Elect is the Prince of Transylvania who hopes that someday he might rule all of Hungary. On the opposing side stands Jagiellonians opposing Transylvanian rule.\n"
  HUN_TRS_NATION_SELECTION_PATHS: "Gameplay Hints:\n   - Solve the Interregnum \n   - Reclaim rebelling subjects\n   - Claim Balkan hegemony\n"
  
  WAL_MOL: "Danubian\nPrincipalities"
  WAL_MOL_NATION_SELECTION_LORE: "Wallachia and Moldavia are usually referred to as the Danubian Principalities. Where as they share common culture and language they disagree on everything else. Wallachia chose a revolutionary path led by a Scandinavian Prince while Moldavia chose status-quo led by the Turkish appointed Prince. The liberal and nationalist government of Wallachia is quite eager to uniting these principalities and then all of Dacians while Moldavia is content with what little they have.\n"
  WAL_MOL_NATION_SELECTION_PATHS: "Gameplay Hints:\n   - As Wallachia commit to the ideal of National Liberation or end it for good \n   - As Moldavia embrace Polish Friendship or submit to National Liberation \n   - Unite Dacian people\n"
  
  CRO_text: "Croatia / Illyria"
  CRO_NATION_SELECTION_LORE: "Croatian Kingdom is legally in a personal union with $HUN$. Their years of regency has left them powerless to enforce their authority on Croatia. This nominal independence led Croatia to unite with Serbia and form Illyrian Confederation.\n"
  CRO_NATION_SELECTION_PATHS: "Gameplay Hints:\n   - Maintain our independence \n   - Unite Southern Slavs\n"
  
  SER_NATION_SELECTION_LORE: "Duchy of Serbia is a dominion of Croatia or Illyria as they title themselves. This voluntary union has not been so amiable to some members of our nation. These dissidents call themselves the 'Black Army' and seek to free Serbia from foreign rule. The Black Army is currently dormant but rumors are their plans to gain independence might soon flower.\n"
  SER_NATION_SELECTION_PATHS: "Gameplay Hints:\n   - Submit to Croatian Yugoslavism or forge our own destiny \n   - Unite Southern Slavs\n"
  
  MAC_NATION_SELECTION_LORE: "Kingdom of Macedonia is a strange union of Greek and Bulgarian people who used to live in Eyalet of Salonica. Having gained their independence with the help of Aragon, Macedonia invited a Aragonese Prince to rule our nation. Unfortunately the King brought some Aragonese friends with him who now rule the country. As a result the locals began to call this new rule as Aragokratia.\n"
  MAC_NATION_SELECTION_PATHS: "Gameplay Hints:\n   - End Aragokratia \n   - Embrace Hellenic or Slavic roots\n   - As Hellenes unite Greeks in Balkans and Anatolia\n   - As Slavs unite Southern Slavs\n"
  
  TUR_text: "Empire of Rum"
  TUR_JAN_NATION_SELECTION_LORE: "Ottoman Empire, Rum, Turkish Empire etc. this nation carries many names but all of them describe a glorius empire while this is merely a crumbling state in an uprising. What once was a beacon of science, commerce and arts is a nation waiting to die. As expected Ottomans are once again in a civil war, this time against their army. No matter who wins this one the winner needs to take radical steps to ensure Rum does not collapse completely.\n"
  TUR_JAN_NATION_SELECTION_PATHS: "Gameplay Hints:\n   - HOLDING THIS PLACE \n"