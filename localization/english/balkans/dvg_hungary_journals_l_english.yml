  je_hungarian_crisis_timeout_tooltip: "Delegates leave after a long stalemate and status quo is enforced"
  
  dvg_european_war: "The Great European War"

  je_hungarian_crisis: "The Hungarian Crisis"
  je_hungarian_crisis_reason: "Burgundian, Scandinavian, be Imperial diplomats have all been meeting with the Foreign Minister regarding a monstrous political snarl. The trouble originated with the conservative Catholic Duke of Nitra, who rallied dissatisfied Hungarian magnates to recognize Holy Roman Emperor Sigismund V as King of Hungary and encouraged him to depose Hungary's liberal Protestant king. This is a direct breach of Article XVIII (annulling the Jagiellon claim to Hungary) of the Treaty of Paris which ended the devastating Great German War in 1820. Burgundy and Scandinavia have become apoplectic at the notion of Sigismund breaking the Treaty and seizing Hungary, and are mobilizing for war against the Empire. \n\nBohemian Power: #variable [Country.MakeScope.Var('dvg_hungarian_crisis_boh_power').GetValue|+=]#!\nPommeranian Power: #variable [Country.MakeScope.Var('dvg_hungarian_crisis_pom_power').GetValue|+=]#!\nHungarian Power: #variable [Country.MakeScope.Var('dvg_hungarian_crisis_trs_power').GetValue|+=]#!"
  
  je_hungarian_interregnum: "Hungarian Interregnum"
  je_hungarian_interregnum_reason: "For over 15 years our nation has been ruled by a regency council. The ongoing conflict between Kémenists and Jagiellonians has prevented us from making foreign and internal desicions. Perhaps this regency will end someday?"
  interregnum_over_tt: "Interregnum has ended"
  
  je_hungarian_expansion: "Reclaiming our nation"
  je_hungarian_expansion_reason: "Now that the Interregnum has ended we have the ability to reclaim our rebellious territories. Afterall our King is also the King of Croatians and Prince of Temesköz."
  hun_croatian_button: "Situation of the Croatian Kingdom"
  hun_croatian_button_desc: "Croatian Kingdom if legally our domain. The perpentual regency however did not respect that fact and let Croatia or 'Illyria' drift from our control. It is time to take back our lost kingdom or we can allow their autonomy if they cede all of their foreign matters to us."
  hun_banat_button: "Situation of the rebellious Bégs in Temesköz"
  hun_banat_button_desc: "Temesköz or Banat as it is more commonly called was part of Hungary after our independence in 1820. The regency took unfortunate policies towards local muslims which caused Banat to rebel. It is finally time to take those rebels out or offer them autonomy if we accept all religions."
  croatian_lands_tt: "We have either conquered Croatia or they are once again our subject"
  croatian_independence_tt: "Croatians have officially declared themselves independent and we did not stop them"
  banat_lands_tt: "We have either conquered Temesköz or they are our subject"
  
