  #JE
  dvg_hungarian_civil_war: "War of Western Aggression"
  #Trait
  war_hero: "War hero"
  war_hero_desc: "This person is a war hero from old wars."

  #Events
  dvg_transylvania.1.t: "Fragmented Kingdom of Hungary"
  dvg_transylvania.1.d: "Kingdom of Hungary gained its independence in 1820 from the Turkish Empire. Years after have not been much easier."
  dvg_transylvania.1.f: "Through the help of rebels, local militias, mercenaries and foreign volunteers the war against the Turks was won. Many peoples took part in our independence, which started to show after the war.\n\nThe first region to demand reparations from Hungary was the Transylvanian. Their popular Prince [SCOPE.sCountry('scope_TRS').GetRuler.GetFullName] is a member of the last Hunyadi house. Thus he claimed the throne of Hungary as his own. In Central Hungary this declaration was rejected as the Transylvanian was half-rumanian, protestant and worse of all a liberal. Also the Royal Crown of Hungary is in Prague and king cannot be crowned without it being returned. As long Hungary is without a Transylvanian King they remain seperate. \n\nSecond country to "leave" Hungary was the Croatian Kingdom. Legally speaking the King of Hungary is also the King of Croatia, but meager hungarian influence has left Croatia to fend for itself. Now Croatia styles itself as Illyria to circumvent the hungarian legal system. Nevertheless Croatia is technically independent as long as hungarians have no king. \n\nThe last region to leave the Hungarian crownlands was surpirisngly the Muslim Beys in Banat. After the independence they decided to cooperate with hungarian rule, but that soon turned out to be a mistake as Hungarian Regency started heavy Muslim discrimination and forced conversions. The Beys gathered and rebelled against Hungary kicking out its nominal garrison in Banat.\n\n If there is any way to reunite all the crownland, it surely is with the Kings guiding hand."
  dvg_transylvania.1.a: "Hungary will prevail..."
  dvg_transylvania.1.b: "The Crown of Hungary belongs to us..."
  dvg_transylvania.1.c: "Hopefully the Hungarian Regency will never end..."
  
  dvg_transylvania.2.t: "Principality of Transylvania and the Kingdom of Hungary"
  dvg_transylvania.2.d: "Transylvania is in a quite confusing situation."
  dvg_transylvania.2.f: "[ROOT.GetCountry.GetRuler.GetFullNameWithTitle] is like his title suggests the beloved Prince of Transylvania and a war hero of the [concept_dvg_rum_collapse]. For that reason he enjoys wide support for his rule. Not only a hero of Transylvania but also the head of house Kémeny, which is the last remaining line of the old Hunyadi kings of Hungary.\n\nDuring the Great Turkish war [ROOT.GetCountry.GetRuler.GetFirstName] announced his claim to the throne of Hungary. After the war ended he gathered enough support to be crowned King by the regency council in Buda. Unfortunately this crowning was only partly legal due the crown of Hungary being in Prague and met with distrust by local catholics and conservative nobles. \n\nNot only the legal dispute but also certain Hungarian Duke has rallied support to illegally crown the Kaiser in Bohemia, which is strictly forbidden by article XVIII of the [concept_dvg_treaty_of_paris]. \n\nPerhaps we should seek international resolve?"
  dvg_transylvania.2.a: "Surely international community will side with us and not start a global war, right?"
  
  dvg_transylvania.3.t: "The Rogue Diet of Nitra"
  dvg_transylvania.3.d: "Troublesome news from Hungary reach our court"
  dvg_transylvania.3.f: "Duke Gábor IV of Nitra has secretly gathered conservative nobles of to declare the Holy Roman Emperor [SCOPE.sCountry('scope_BOH').GetRuler.GetFullName] as the King of Hungary. Not only is this illegal according to [concept_dvg_treaty_of_paris] but also treasonous considering that [ROOT.GetCountry.GetRuler.GetFullNameWithTitle] is to be crowned the king. If international intervention is not coming, civil war is surely here."
  dvg_transylvania.3.a: "They are illegally trying to steal my throne!"
  
  dvg_transylvania.4.t: "We have been invited to solve the Hungarian Crisis"
  dvg_transylvania.4.d: "International response to the [SCOPE.sCharacter('nitra_scope').GetFirstNamePossessive] power play has not been easy"
  dvg_transylvania.4.f: "Several great powers of Europe call for a new congress to decide the fate of Hungarian Crown peacefully. Rightfully so we have been personally invited by the foreign minister of Burgundy Maxime Degrelle to attend this congress. Now begins the great game to influence Imperial politics and force the Kaiser to retreat. The herald of our Kingdom in Transylvania shall be the head of a minor noble house Horthy de Nagybánya."
  dvg_transylvania.4.a: "Colonel József Horthy de Nagybánya shall represent the legal King!"
  
  dvg_transylvania.5.t: "Prague concedes"
  dvg_transylvania.5.d: "As the Hungarian Crisis comes to a peaceful conclusion the terms are being laid to table"
  dvg_transylvania.5.f: "Most important term of the Congress of Venice was the return of the Szent Korona to Buda. With the crown in Hungarian soil a rightful king could be crowned. The King in Transylvania is already preparing a carriage to Buda, but the regency council could have other ideas..."
  dvg_transylvania.5.a: "Hungary cries for their king"
  
  dvg_transylvania.51.t: "Hungary calls for their King"
  dvg_transylvania.51.d: "The long awaited letter finally arrived!"
  dvg_transylvania.51.f: "Hungary has now prepared themselves for our righteous return. Soon [ROOT.GetCountry.GetRuler.GetFullNameWithTitle] sits in Buda Palace with the Szent Korona on his head. Prosperous future awaits Hungary..."
  dvg_transylvania.51.a: "Ave Christophorus Hunyadi, Rex Hungariae"
  
  dvg_transylvania.52.t: "Hungarian regency has betrayed us!"
  dvg_transylvania.52.d: "We must stop this rebellion at once"
  dvg_transylvania.52.f: "Hungary has chosen someone else than [ROOT.GetCountry.GetRuler.GetFullNameWithTitle]. This is a clear violation of our national laws. It is time to stop these secessionists before they get any brighter ideas."
  dvg_transylvania.52.a: "Tonight we drink rebel tears"
