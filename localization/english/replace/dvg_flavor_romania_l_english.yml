l_english:
 je_romanian_unification: "Uniting Dacia"
 je_romanian_unification_reason: "For far too long the Dacian people have been split amongst several states, we must take the mantle of Dacian nationalism and unite Dacia into one, for all Dacians!"
 je_moldavian_troubles: "Independence is a hard road to travel" 
 je_moldavian_troubles_reason: "As Moldavia gained independence our nation has seemingly gone worse year by year. The reason for this is uncontestedly our infertile Prince [ROOT.GetCountry.GetRuler.GetFullName] and the Polish court that controls much of our government"
 dragos_not_dead_tt: "#Bold Prince Alexandru Dragoș# has perished"
 je_national_liberation_government: "Government of National Liberation"
 je_national_liberation_government_reason: "From the independence in 1820 our nation has been led by a authoritarian liberal coalition government (Guvernul de Eliberare Națională or GEN). They have done much to improve the lives of Rumanians and are quite popular. They are now eyeing towards united Dacia so that the liberation may soon end."
 
 dvg_romania.1.t: "Rumanians of Dacia"
 dvg_romania.1.d: "From Rome, Hungary and Rum to independence"
 dvg_romania.1.f: "Our people have been subjects to many rulers. Most recent of these was the Turks of Rum. Years of oppression and slavery finally caught up with the Turks as our people rose against them alongside other disgruntled Rumish autonomies. \n\nFortunately our independence was less bloody as our northern and western neighbours. Turkish garrison here were minimal and most of our soldiers were local Rumanians. Thus as the Hungarians waged war against the Turks we just defended our borders and prevented any Turkish invasion over the Dunăre.\n\nIn 1820 as German Revolution came to an end and Western realms turned their eyes towards Balkans the Turks were forced to retreat and give up the rebelling autonomies. So began our independence and the unfortunate seperation of Moldavia and Wallachia continued."
 dvg_romania.1.a: "Maybe one day Dacia will be nation once again..."
 
 dvg_romania.2.t: "Principality of [SCOPE.sCountry('scope_WAL').GetName]"
 dvg_romania.2.d: "16 years of independence have been kind to us and perhaps soon we will stand to unite all Rumanians"
 dvg_romania.2.f: "As [SCOPE.sCountry('scope_WAL').GetName]s began our struggle for independence then Rumish-alligned Prince Gavriil Callimachi refused to give power to a coalition of liberal and nationalist forces in the army and the nobility. This led to his deposition at the hands of said coalition which then formed an entity called 'Government of National Liberation' with a sole purpose of ending Turkish rule and uniting Rumanian people. As the revolution grew towards the end it became clear that the Moldavians were not keen on joining with us and the Transylvanian Rumanians had an identity problem thinking they were Hungarians. Thus our nation of Wallachia became free with the rest of our people under other nations.\n\n Currently our nation is being ruled by Prince [ROOT.GetCountry.GetRuler.GetFullName], who was elected by the Government of National Liberation to be the figurehead of our nation with hopes that a stringless ruler from liberal Scandinavia would stop any conflicts between the government and the Prince. He was not the first candidate as we offered the crown to a de Bourgogne but Anglo-French objected. In the end Stewarts of Scotland were the correct choice as [ROOT.GetCountry.GetRuler.GetFirstName] is quite content with his position."
 dvg_romania.2.a: "Wallachia today, National Liberation tomorrow!"
 
 dvg_romania.21.t: "National Liberation comes to an end"
 dvg_romania.21.d: "The coalition has failed it's goals and lost popular and royal support"
 dvg_romania.21.f: "Decades of rule has now finally come to an end as the Government of National Liberation was ousted by the Royal Guard. While they certainly did improve Wallachia for many years their momentum has slowed down and now it is time for these old revolutionaries to retire."
 dvg_romania.21.a: "So begins a new era of Wallachia"
 
 dvg_romania.22.t: "National Liberation complete in Moldavia"
 dvg_romania.22.d: "Our Government of National Liberation has achieved yet another of it's promises"
 dvg_romania.22.f: "Moldavia now lies under our control and we have started to take measures to ensure Moldavian liberation from tyranny. First step was crowning [ROOT.GetCountry.GetRuler.GetFullName] as the prince of Moldavia. Second step was ditchin the name of Wallachia and adopting a new name called Rumanian Principalities to symbolise our continuing liberation. Next step is uniting all Rumanians like in Hungary and along the Black Sea."
 dvg_romania.22.a: "Rumania today, National Liberation tomorrow!"
 
 dvg_romania.3.t: "Principality of [SCOPE.sCountry('scope_MOL').GetName]"
 dvg_romania.3.d: "16 years of foreign meddling and internal troubles"
 dvg_romania.3.f: "[SCOPE.sCountry('scope_MOL').GetName] gained independence but nothing else. [ROOT.GetCountry.GetRuler.GetFullName] decided that the best way forward was status quo. This meant that Turkish era laws stayed in effect with all of their downsides. Our people remained poor and opressed by big landowners while the Prince kept partying at his many Manors. \n\nAs years went by and the Prince grew older hope rose that his heir was going to free the people. Only prolem was that [ROOT.GetCountry.GetRuler.GetFirstName] has no heir. His marriage to a French-Polish noblewoman Anna Karolina de Bourbon-Pacowie has lasted for nearly 20 years and they still have no children. Because of this Anna Karolina's brother Louis Jean de Bourbon-Pacowie has already claimed the throne as his own with great support from Poland. \n\nOn the other hand we could take radical actions against the Polish Boourbons and elect the Moldavian branch of the National Liberation movement (Guvernul de Eliberare Națională or GEN) to act as a regency council until Wallachian Prince [SCOPE.sCountry('scope_WAL').GetCountry.GetRuler.GetFullName] is elected as our Prince as well."
 dvg_romania.3.a: "Could this illbred impotent cuck [ROOT.GetCountry.GetRuler.GetFirstName] already die?"
 
 dvg_romania.31.t: "Funeral and a Coronation"
 dvg_romania.31.d: "This morning our nation mourned and celebrated as the old prince was laid to rest and a new one crowned"
 dvg_romania.31.f: "As Prince Alexandru was laid to rest the attendees continued back to the church for a coronation. [ROOT.GetCountry.GetRuler.GetFullName] was crowned by Ecumenical Patriarchate of Constantinople in front of a meager audience mainly compromised of local nobles, Prince's Polish Guard and some foreign dignitaries. Then [ROOT.GetCountry.GetRuler.GetFirstName] began his speech by surpisingly..."
 dvg_romania.31.a: "Inviting the Polish Army to take care of GEN terrorism"
 
 dvg_romania.32.t: "National Liberation complete in [SCOPE.sCountry('scope_MOL').GetName]"
 dvg_romania.32.d: "Our cadet movement in [SCOPE.sCountry('scope_MOL').GetName] has secured their position and now lead the country"
 dvg_romania.32.f: "We have recieved news from [SCOPE.sCountry('scope_MOL').GetName]. Their Prince has died without an heir and the government was taken over by our sister movement there. They now are inviting our Prince [ROOT.GetCountry.GetRuler.GetFullName] as their Prince as well. Our plans for Moldavia are finally done and next step is Rumanians everywhere."
 dvg_romania.32.a: "Dacia is one step closer to becoming reality"
 
 dvg_romania.4.t: "Nation once again"
 dvg_romania.4.d: "Our promise to unite all Dacians under one nation is now finished"
 dvg_romania.4.f1: "Not since Roman Dacia has our country been unified. Now begins a new era of Dacian Golden Age. Let the names of those who fought and died for Dacia be forever in our hearts."
 dvg_romania.4.f2: "Not since Roman Dacia has our country been unified. Now begins a new era of Dacian Golden Age. With that the promise of democracy by Government of National Liberation is now to be fulfilled and GEN has completed its purpose. Let the names of those who fought and died for Dacia and GEN be forever in our hearts."
 dvg_romania.4.a: "Liberation fulfilled, promises kept"
 dvg_romania.4.b: "Long road to independence is now done"