l_english: 
 
 #JE
 je_black_army_dormant: "Black Army dormant"
 je_black_army_dormant_reason: "Crna Armija has been largely silent for over 10 years. Before they dissapeared they stated that they were planning something big. We can only wait and see if their plans ever come true."
 black_army_woke_tt: "Decades of planning unfolds"
 black_army_start_tt: "Black Army wakes up"
 free_without_army_tt: "We have gained freedom without the help of terrorists"
 #Events
 dvg_serbia.1.t: "Duchy of Serbia under Illyria"
 dvg_serbia.1.d: "In 1820 with the help of Croatian soldiers our nation managed to gain independence from the Turks."
 dvg_serbia.1.f: "Our intial rebellion was doomed from the start. No central government, no military or proper leadership not even modern weapons to give to any of the would be rebels. Fortunately several other nations opressed by the Turks also joined the rebellion. \n\nUnlike the others we did not recieve any fancy foreign volunteers or veteran mercenaries so our battle were fought by disgruntled peasants and policemen. This lack of proper skill started to show as the Turks started to advance to Belgrade.\n\nThen in a surprising turn of events Croatian Kingdom diverted most of their troops to our border and offered help. Of course we had to accept and they courageously defended Belgrade and freed Southern Serbia and Crna Gora from the Turks. Even more surprisingly they return home soon after. \n\nIn 1820 the interim government decided to thank the Croatians by offering to join their Kingdom as a Duchy. They accepted..."
 dvg_serbia.1.a: "For Slavic unity!"
 
 dvg_serbia.2.t: "The Black Army"
 dvg_serbia.2.d: "Centralni odbor za oslobođenje Srbije or the Central committee for liberation of Serbia is an underground terrorist organization"
 dvg_serbia.2.f: "In 1820 as Serbia offered to join Croatian Kingdom several serbians saw this move as treason. Most of the little army we had defected and formed an organization to liberate Serbia once again. They took the name 'Central committee for liberation of Serbia' and adopted black flag with a skull. \n\nTheir actions ranged from bombings, shootings and protests and lasted for few years after our independence from Turkish rule. \n\nSurprisingly they stopped and seemingly dissapeared from public view. When former members were questioned about the Armys whereabouts they only said "Our plans are measured in decades". For over 10 years they have been hiding and the duchy fears the day they return."
 dvg_serbia.2.a: "Those bastards are up to something"