l_english:
 napoleonic_warfare:0 "Wenceslausian Warfare"
 napoleonic_warfare_desc:0 "Emperor Wenceslaus revolutionized warfare, emphasizing the importance of properly utilizing artillery."
 vertical_archipelago:0 "Vertical Archipelago"
 vertical_archipelago_desc:0 "The Native Andean economic system of resource distribution, based on barter exchanges and collective labor between communities, as well as state-sponsored welfare and public infrastructure projects."
 pre_dreadnought_tech:0 "Pre-Nayezpaspeur"
 pre_dreadnought_tech_desc: "Standardizing ship designs of battleships in order to produce a higher number of them. These ships are built from steel and powered by steam engines."
 dreadnought_tech_desc:0 "By making a warship with only heavy caliber guns and steam propulsion, it is possible to overpower all other types of ship."
 dreadnought_tech:0 "Nayezpaspeur"
  battleship_tech:0 "Super Nayezpaspeur"
 battleship_tech_desc:0 "By taking the dreadnought design and making all the guns high caliber, as well as some other changes, it is possible to make an even more devastating warship."