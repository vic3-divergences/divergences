 ###EVENTS###
 
 ##Main political events - pre-rework##
 
 poland.1.t:0 "The Rzeczpospolita"
 poland.1.d:0 "Oh, how the mighty have fallen, we, whose domains once spanned all of the lands east of oder."
 poland.1.f:0 "The Polish-Lithuanian Commonwealth has been in decline since the XVIIth century. The crown of Poland and Lithuania was forced to give several concessions to the nobility over the centuries making the elected King nothing more than a glorified puppet in the hands of the Magnates holding huge domains where serfdom still prevails. The Union between the crown of Poland and its Ruthenian and Lithuanian territories has weakened as the Hetmans and foreign powers influence the governors of these areas. Poland is not vulnerable to Revolution thanks to a relatively Liberal political situation but if the Magnates aren't kept in check it's hard to see what will happen to Poland"
 poland.1.a:0 "Si Deus nobiscum quis contra nos?"

 poland.2.t:0 "Centralization Of Commonwealth"
 poland.2.d:0 "Oh, how the mighty have fallen, we, whose domains once spanned all of the lands east of oder, now can't put down a mere mob of Dahlkists, but now these are laments of the past, with the help of our benevolent king we have eradicated those revoltionary pests and now cometh time of our renaissance and beginning of return of our eastern hegemony."
 poland.2.f:0 "The empire, long divided, must unite; long united, must divide. Thus it has ever been."
 poland.2.a:0 "Second Union Of Lublin"

 poland.3.t:0 "Centralization Of Commonwealth"
 poland.3.d:0 "Oh, how the mighty have fallen, we, whose domains once spanned all of the lands east of oder, now can't put down a mere mob of Sarmatists, but now these are laments of the past, with the help of our benevolent king we have eradicated those reactionary pests and now cometh time of our renaissance and beginning of return of our eastern hegemony."
 poland.3.f:0 "The empire, long divided, must unite; long united, must divide. Thus it has ever been."
 poland.3.a:0 "Second Union Of Lublin"

 poland.4.t:0 "Plight of Ruthenians"
 poland.4.d:0 "Since time immemorial, our peoples have been oppressed and humiliated, by the Norse, Tatars, Lithuanians, and now by the Poles. But the time has come to end it for good! We shalln't tolerate what our fathers did, we will free our families and friends, for they will be witnesses of our new glorious age!"
 poland.4.f:0 "The Blue Heaven is dying\n The Yellow Heaven arising\n A new cycle is beginning\n Bringing good fortune for all."
 poland.4.a:0 "A Mortal Threat To The Commonwealth"

 poland.5.t:0 "The Great Ruthenian Uprising"
 poland.5.d:0 "To [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] "The cursed King, Slavic Caesar's son, and attendant of the infernal Lucifer in the abyss of hell Polish emperor, footstool of the Galcians, cook of Elbians, locksmith of Russians, wheelwright of Czestochowa, drunkard of Lithuanians, swineherd of greater and lesser Poland, sausage of Warsaw, and dog of Bohemians, the cursed childish knave upon earth and the world, the great fool of Kamenets-Podolsky and the country, and a nasty pig in the world, the Polish biter of men, the commander of the whole hellish empire in the deep abyss of hell, an angel of the infernal devil, a mocker of the crucified God, enemy and persecutor of his servants, below all those who live above, the downfaller of the bishop men: We report to you that we have no thoughts of surrendering to you, but are bravely, manfully, and eternally resolved to fight you and whomever you call a fellow. " "
 poland.5.f:0 "Earth is greater than Heaven now;\nThe sun and moon change places.\nOnce I ruled over everything,\nNow I live on the edges. "
 poland.5.a:0 "Deluge of our times"

 poland.6.t:0 "New Treaty of Hadiach"
 poland.6.d:0 "Rejoice, people rejoice, for it is a day that your children will celebrate for centuries. By the decree of our [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] our eastern brethren have been recognized as our equals. Many have voiced their concerns and called Ruthenians, lazy, arrogant and unfit called to be citizens of Commonwealth, but those voices now have no power, for King's word is final and we us his loyal subjects must accept Ruthenians as our brothers and sisters."
 poland.6.f:0 " Even though we come from separate nations\n We vow to stand by each other\n And be blood brothers for ever\n Let us agree to protect people of our homelands!"
 poland.6.a:0 "And so ends a 500 year old struggle, or a new begins?"

 poland.10.t:0 "The East Withdraws"
 poland.10.d:0 "The dead of Maximilian and the inability for the Commonwealth to manage its problems led to a complete loss of influence in the East."
 poland.10.f:0 "Both Smolensk and the Cossacks have stopped reporting to the registry, and begun to pursue an independent policy."
 poland.10.a:0 "We will return in time."

 ##Vistula Works##
 
 poland.100.t:0 "The Completion of the Vistula Works" 
 poland.100.d:0 "We have successfully completed the Vistula Works! Our industrialists are pleased and are gearing up to further expand their industries!"
 poland.100.f:0 "After many years of hard work, innovation and construction, the Vistula Works are complete. We have proven to the world that we are a modern nation, standing at the forefront of innovation and construction!\n\n Our investments will surely pay off too, our new railway networks and canals are already bustling, with smaller villages popping up along them at key areas, with smaller towns now growing as industrial operations expand. Whilst this project may have been expensive and arduous, it is ultimately for the betterment of our people!"
 poland.100.a:0 "Hurrah to the Captians of Industry!"
 
 poland.101.t:0 "Cancelling the Vistula Works"
 poland.101.d:0 "For whatever reason, we have been forced to cancel the remaining Vistula Works, to the great disappointment of the [SCOPE.gsInterestGroup('industrialists_ig_pol').GetName]"
 poland.101.f:0 "Due to perhaps a lapse on our behalf, the Vistula Works have been cancelled. Many of the [SCOPE.gsInterestGroup('industrialists_ig_pol').GetName] are severely disappointed, knowing that their patronage has been lost and potential for profits have been dashed!"
 poland.101.a:0 "Truly a shame..."
 
 poland.102.t:0 "Redirecting the Vistula"
 poland.102.d:0 "The Vistula Delta is productive farming area, but the delta is largely untamed. With modern methods, we can redirect the Vistula to best serve the country"
 poland.102.f:0 "We have been presented with three possible options for redirecting the mouth of the Vistula;\n\n#bold - Option One - #!redirect the Vistula through Gdańsk, providing a better source of fresh water for the city, firmly establishing the city as our major port on the Baltic Sea. This will also come with upgraded port facilities and a minor renovation of the city, turning it into a favourable location for further developments!\n\n#bold - Option Two - #!Redirecting the Vistula straight to the Baltic Sea, this will straighten the course of the river and make it easier for inland boats to make it to the sea, lessening the danger in navigating the delta. This will make it easier for upriver cities to develop port facilities and promote inland trade!\n\n#bold - Option Three - #!Leaving the river be, yet modernising the delta landscape. This will expand the irrigation facilities of the delta, improving the productivity of the land in and around the delta!"
 poland.102.a:0 "We will redirect it through Gdańsk"
 poland.102.b:0 "We will redirect it straight into the Baltic Sea"
 poland.102.c:0 "We will improve the existing delta without redirecting the river"
 
 poland.103.t:0 "Lublin on the Vistula?"
 poland.103.d:0 "Lublin is a fairly significant city; a gateway to the east of the country and the wild lands beyond! However it is only accessible by road, making freight transport arduous!"
 poland.103.f:0 "Having been established as a town in the late 1200s, and built up by Casimir the Great in 1341, Lublin is a comparatively new city in Poland, compared to others. However Lublin has proved itself, serving an important role in the route to our eastern subjects. Now Lublin stands on a pivot, with the discovery of vast mineral deposits in the regions around Lublin, a transport link to the centre of the country is more important than ever!\n\n Canals have long been the obvious choice, a planned route of about 50Km to the Vistula through several villages to the town of Puławy is the most obvious route. However the small amount of railways in and around Lublin have proven to be promising, should we develop a larger network, connecting Lublin to the rest of it would be quite beneficial!"
 poland.103.a:0 "Build a grand canal linking the city to the river!"
 poland.103.b:0 "Use the existing railway and establish portage on the river!"
 poland.103.c:0 "Build a railway and connect it to the Warsaw-Krakow line!"
 
 poland.104.t:0 "The Opening of the Warsaw-Krakow Railway!"
 poland.104.d:0 "With all the construction finished, now comes the moment we cut the ribbon and announce the opening of the Warsaw-Krakow railway!"
 poland.104.f:0 "Smaller trains have been running along some portions of the line, supporting local industries and connecting villages to larger towns. However no major services have been announced, the honour left up to us!\n\n We have recieved a strong recommendation to begin passenger services, which have proved profitable in other parts of the world already. Being our two largest and most important cities too, we will recoup our money easily!\n\n Though we've also recieved another recommendation, to instead tune to the network for frieght, supporting the growth of industries along the route of the line, allowing goods to easily flow between the two cities. It will take some time for these lines and industries to take route, but no doubt they will soon enough."
 poland.104.a:0 "Open extensive passenger services on the line"
 poland.104.b:0 "Prioritise frieght services along the line"
 poland.104.c:0 "Sell the railway to the local landowners"
 
 poland.105.t:0 "Warta Works"
 poland.105.d:0 "The Warta is the major river running through Poznan, however it lacks much of the modern amenities that our other cities do."
 poland.105.f:0 "Whilst Poznan was not initially considered to be part of the Vistula Works, some representatives from the city have suggested that we address it.\n\n The Warta is the river that runs through the centre of the city, whilst smaller than the Vistula, it is deeply important for the city! We have recieved two proposals for the city and the river: the first option is constructing a treatment plant for the city, this will filter and ensure clean and sanitary water for the tenements and industries of the city. If this proves helpful for the residents, then we may construct more treatment plants across the country! The other proposal is to turn the city into a beautiful canal city, renovating much of the old town whilst constructing several new parts of the city. Whilst the plan is ambitious, it has wide-spread support of the residents and magnates alike!"
 poland.105.a:0 "Construct a treatment plant for the river water!"
 poland.105.b:0 "Renovate the city and build beautiful canals!"
 
 poland.106.t:0 "Krakow Portage"
 poland.106.d:0 "Historically the Vistula has narrowed and lost some depth on the way to Krakow, leaving boat traffic limited, we should change this!"
 poland.106.f:0 "Despite the possibility of a railway reaching Krakow, allowing boats into Krakow is still a popular idea amongst the industrialists of the city. It will help connect smaller villages and local industries along the Vistula to the city, providing a great boon to the region's infrastructure!\n\n We can derive some additional benefits by expanding the canals to some smaller towns, especially Tarnów, which has grown greatly over the past decades as a significant industrial town!"
 poland.106.a:0 "Construct a series of locks and canals to Krakow!"
 poland.106.b:0 "Expand the project to Tarnów!"
 
 poland.107.t:0 "Investments in the East?"
 poland.107.d:0 "The Eastern portion of our country has lagged behind the Western parts, we should take steps to modernise this region!"
 poland.107.f:0 "Whilst the far east of our country is more autonomous, the regions around Volhynia and the further reaches of Galicia are a fully-integrated part of our nation. Yet walking around in their towns, you would not be able to tell, towns are lagging behind in many regards, with little to no paved roads, few schools and hospitals and poor water infrastructure.\n\n Now that we have extended the railways out to those regions, it will be far easier to improve their amenities! Whilst most of the plans are broad and cover all areas, we can steer the wheel a little to ensure that specific areas are focused on. Giving some smaller companies charters to expand in some towns will ensure significant economic development. Or perhaps we should focus on education to prepare the kind people of these regions for work in factories. Perchance instead we should use some of our knowledge from other Vistula Works projects and focus on sanitation infrastructure, improving the quality of life in these regions."
 poland.107.a:0 "Focus on Construction"
 poland.107.b:0 "Focus on Education"
 poland.107.c:0 "Focus on Sanitation"

 ###JOURNAL ENTRIES###
 
 ##Main political events - pre-rework##
 
 je_golden_liberty:0 "Golden Liberty"
 je_eastern_resistance:0 "The Eastern Troubles"
 je_golden_liberty_reason: "The Szlachta has dominated our politics for centuries and they still make a very important part of our politics, but what was once called The Golden Liberty which made Commonwealth a beacon of tolerance and freedom now drags us down like an iron chain, preventing our state from modernizing, to cure our ills we must either curtail Szlachta's privileges or appease them by cementing their position.\n\n@information!#blue Gameplay Advice:\nThere are two ways to complete this Journal Entry, the easier one will lead you down a more reactionary path, the harder one will lead you to favour the middle classes of Poland."
 je_eastern_resistance_reason: "The vast swaths of land that make up our eastern holdings have been largely neglected for the most part of our history and what once made up The Great Kyivan Rus now is place of constant Tatar raids and exploitative serfdom of The Szlachta, if we don't end their plight and allow them to flourish within our borders, they eventually will rise up and take the matter into their own hands, which will mean the end of The Commonwealth."
 je_uniting_the_commonwealth:0 "Uniting The Commonwealth"
 je_uniting_the_commonwealth_reason:0 "The rebelious dissidents have been defeated, but there's still work to be done. Our eastern domains have grown quite autonomous as the cause of our king's leniency. Now it's time to rein them in and make them kneel before our king!"
 plc_united:0 "Unite The Polish-Lithuanian Commonwealth"
 can_unite_plc_txt:0 "Issue of The Golden Liberty has been dealt with"
 can_unite_plc:0 "Issue of The Golden Liberty has been dealt with"
 
 je_pol_king_maximilian:0 "The Death of Maximilian"
 je_pol_king_maximilian_reason:0 "The king of the Commonwealth's 20 years of rule, were mostly marked by his inability to hold any power in his Kingdom. All Sejms convened by Maximilian III were defeated by the use of liberum veto, which allows for any noble to oppose proposals of the Assembly, and the pervading influence of Scandinavia and Bohemia. On his death, the Sejm will convene and the primary candidate, his son Stanislaw is in a good position to succeed him."
 pol_east_withdraws:0 "Smolensk and Cossacks withdraws from the Commonwealth"
 pol_maximilian_died:0 "King Maximilian of the Commonwealth has died"
 
 ##Vistula Works##
 
 je_pol_early_industrial_development: "The Vistula Works"
 je_pol_early_industrial_development_reason: "The Vistula Works are a series of planned developments focused around the Vistula, from the mouth at Gdańsk all the way to the great city of Warszawa, and further beyond. The Vistula has long been the backbone of the Polish nation-state, now it is time to modernise it and bring both itself, and its surroundings, into the Elisabethian era!\n\n@information!#blue #bold Gameplay Advice:#! Deciding to #bold Complete the Vistula Works#! will close this Journal Entry, meaning that you will no longer be able to complete any of the additional #bold Bonus Projects#!. Completing the all the #bold Bonus Projects#! will grant a greater reward upon completing this Journal Entry."

 ###BUTTONS###
 
 ##Main political events - pre-rework##
 
 dvg_pol_transfer_plock_button: "Purchase Białystok"
 dvg_pol_transfer_plock_button_desc: "Białystok - known in Lithuanian as Balstogė - is a border region of Lithuania with a significant Polish minority. Historically the area had been part of Poland, yet was transferred to Lithuania in 1701. With the promise of further economic development, the Lithuanian Sejm will allow us to purchase the territory and resote Białystok to Polish administration."
 
 ##Vistula Works##
 
 #Main Vistula Works#
 dvg_pol_vistula_finish_works_button: "#bold Complete the Vistula Works#!"
 dvg_pol_vistula_finish_works_button_desc: "Having finished the major projects of the #bold Vistula Works#!, we can now safely announce the project's completion!"
 dvg_pol_vistula_mouth_button: "#bold Vistula Works:#! Head Redirection"
 dvg_pol_vistula_mouth_button_desc: "The head of the Vistula is largely untamed, with several routes flowing into the Baltic Sea, through Gdansk, or into the Vistula Lagoon. We should look into changing the course of the river at its head in order to benefit us."
 dvg_pol_vistula_lublin_canal_button: "#bold Vistula Works:#! Connecting Lublin"
 dvg_pol_vistula_lublin_canal_button_desc: "Lublin is largely isolated from the Vistula, with no navigable connection between it and the Vistula. We should change this, connecting Lublin to the Vistula will turn it into a gateway to the east of the country."
 dvg_pol_vistula_connecting_krakow_button: "#bold Vistula Works:#! Krakow-Warsaw Railway"
 dvg_pol_vistula_connecting_krakow_button_desc: "With the completion of the Krakow-Warsaw Railway - now given the apt nickname, the #bold "Iron Vistula" #!- we can now announce to our people and the world its completion!"
 
 #Bonus Vistula Works#
 
 dvg_pol_vistula_warta_works_button: "#bold Bonus Project:#! Warta Works"
 dvg_pol_vistula_warta_works_button_desc: "The Warta flows through Poznań, one of the oldest and most significant cities in Poland. Unfortunately, it has lacked significant works and is often the cause of cholera outbreaks. We should change this and modernise the river."
 dvg_pol_vistula_krakow_portage_button: "#bold Bonus Project:#! Krakow Portage"
 dvg_pol_vistula_krakow_portage_button_desc: "The Vistula reaches the historical city of Krakow, yet isn't large enough to handle significant boat traffic, with a series of planned locks, canals, dikes and bridges, we can allow industrial boat traffic to reach the city."
 dvg_pol_vistula_connecting_eastern_poland_button: "#bold Bonus Project:#! Connecting the East"
 dvg_pol_vistula_connecting_eastern_poland_button_desc: "The eastern regions of our country are less developed and are often overlooked. By extending infrastructure out eastwards, these regions too can benefit from the same development the rest of the country does."
 
