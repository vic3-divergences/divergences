l_english: 
 
 #JE
 je_croatian_governorate: "Croatian Kingdom under Hungarian crown"
 je_croatian_governorate_reason: "Croatia is in a nominal personal union with Hungary. Fortunately Hungary lacks a king so we are technically free to do as we please. Perhaps we should officialize this freedom before "we" recieve a King?"
 croatian_officially_free_tt: "Croatia has broken the personal union with Hungary"
 croatia_to_yugoslavia_tt: "We can now begin the path to unite Yugoslavia"
 #Events
 dvg_croatia.1.t: "Croatian Kingdom inside Kingdom of Hungary"
 dvg_croatia.1.d: "In 1820 we alongside many other Balkan nations won our independence from the Turks."
 dvg_croatia.1.f: "As Turkish empire declined it became clear that our independence was close. [concept_dvg_german_revolution] woke our people up and after the assasination of the Hungarian Beylerbey the Great Turkish war began. \n\nCroatia had meager forces mainly compromised of militias, revolutionary volunteers and an attaché from Venice. Thankfully the local Turkish garrison was even smaller and we quickly took over their armouries. This allowed us to send some troops to help our weaker slavic brothers in croatia. Of course we expected to gain something from this like perhaps an union? \n\nAs the war ended in 1820 we were once again independent from the Turks but had to submit to Hungarian rule due to our medieval laws."
 dvg_croatia.1.a: "Glorius victory indeed"
 
 dvg_croatia.2.t: "From Croatia to Illyria"
 dvg_croatia.2.d: "Soon after the war ended, we recieved an offer from the Serbs. Certainly our sacrifices were not in wain."
 dvg_croatia.2.f: "The offer summarized was that the croatians joined our Croatian Kingdom as a duchy in exchange of limited autonomy and a Croatian garrison. Then Governor Tomislav Blagajski happily made a treaty to formally invite croatians to our nation signing it at the end. \n\nOnly problem was our legal system. To add a duchy to our Kingdom the King had to sign this law aswell. The problem was that there was no King of Hungary to sign it as the Regent wasn't allowed to. \n\nAfter weeks of pondering our top jurists made a loophole. The Serbs would not join "Croatian Kingdom" but "Illyrian federation" led by the Governor of Croatia. Thus the treaty was sent from Illyria to croatia who signed it aswell. So Illyria and an idea of Yugoslavism began..."
 dvg_croatia.2.a: "First we gain independence from Hungary then we unite Slavs"