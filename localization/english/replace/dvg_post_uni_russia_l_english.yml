l_english:

#JEs
 je_bureaucratic_burden: "Overburdened Administration"
 je_bureaucratic_burden_reason: "Our Administration faces a new challenge after the unification of [SCOPE.sCountry('scope_RUS').GetName], they have no idea how to administer all the different people from all the different states. Some know how to navigate the complex monarchial and Veche laws while others are used to just aministrating their local cossack laws. This is why our citizen have no unified legal structure and those to enforce it and it is most important for everybodys sake that we address this immediately."
 je_tatar_question: "Settling Tatar question"
 je_tatar_question_reason: "Currently our biggest non-slavic non-christian citizen group is the Tatars of Tatariya. After our unification their nationalist ideas have started to bloom and now they seek to create a unified country for themselves like the Cumans or Mongols centuries ago. It is nesessary that we wipe out their unrest before we can truly be united."
 je_russian_identity: "National Confusion"
 je_russian_identity_reason: "Russia used to consist of dozens of small principalities, republics and Cossack hosts. After Russian unification our people don't really know who they are supposed to be. This is a prime oppurtunity to enstablish a new heavily regulated identity to all of our people."
 je_russian_identity_complete_tt: " - Our popular support must be cemented \n - Tatar Question Journal Entry must be completed \n - Overburdened Administration Journal Entry must be completed"
 je_russian_identity_oncomplete_tt: "We will declare a new state depending on our choice"
 rus_identity_fail_tt: "- Two opposing identities have cemented their popular support \n - The Common folk are revolting against our government \n - Tatar question Journal Entry and Overburdened Administration Journal Entry are still undone or failed"
 status_russian_identity_start: "No Identity is ahead"
 status_in_lead_and_chosen: "Our side is gaining popular support"
 je_united_eurasians: "United Eurasians"
 je_united_eurasians_reason: "We are committed to a new Eurasian culture. If various communities in our nation are willing to accept it we can assimilate them into Eurasianism"
 
