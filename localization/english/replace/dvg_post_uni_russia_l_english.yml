 #Buttons
 stage_tatar_revolt_button: "Stage a Tatar Uprising"
 stage_tatar_revolt_button_desc: "One possible way to quench the Tatar unrest is to plant spies among them and coerce them to rise up against us. This way we know exactly when they rise up and where."
 
 integrate_east_slavs: "Assimilate East Slavs"
 integrate_east_slavs_desc: "Once East Slavic people are accepting of our rule we can begin educating them to the ways of Eurasianism"
 integrate_uralics_and_baltics: "Assimilate Uralics and Baltics"
 integrate_uralics_and_baltics_desc: "Once Uralic, Finnic and Baltic people are accepting of our rule we can begin educating them to the ways of Eurasianism"
 integrate_tatars_and_turks: "Assimilate Tatars and Turks"
 integrate_tatars_and_turks_desc: "Once Tatars and Turkic people are accepting of our rule we can begin educating them to the ways of Eurasianism"
 integrate_caucasians: "Assimilate Caucasians"
 integrate_caucasians_desc: "Once Caucasian people are accepting of our rule we can begin educating them to the ways of Eurasianism"
 integrate_siberians_and_mongols: "Assimilate Siberians and Mongols"
 integrate_siberians_and_mongols_desc: "Once Siberian and Mongolic people are accepting of our rule we can begin educating them to the ways of Eurasianism"
 
 #Decision 
 dvg_pan_slavic_proposal: "Propose Union to our Slavic allies"
 dvg_pan_slavic_proposal_desc: "The core idea of our nation is to unite all slavic peoples under one flag. We can send proposals to all the Slav nations at once and see who is willing to join."
 
 #Events
 dvg_rus_iden.10.t: "First Russian National Day"
 dvg_rus_iden.10.d: "Today was the first Russian National Day but no one actually knows what a Russian is supposed to be" 
 dvg_rus_iden.10.f: "People gathered today at midday around the nation to celebrate the first Nation Day of [SCOPE.sCountry('scope_RUS').GetName]. \n\n The festivities went well but as the day grew towards the end no one actually knew what they were celebrating. Some said that their former city-state won some war, some say they celebrated independence from Poland and Scandinavia. \n\n In the end no one actually knew who Russians were since just few years ago they were bitter rivals. This realisation caused a massive shockwave among the people who desperately needed a unifying identity"
 dvg_rus_iden.10.a: "We need to adress this immediately"
 
 dvg_rus_iden.1.t: "Troubles Never Ending"
 dvg_rus_iden.1.d: "New problem arises with Russian unification"
 dvg_rus_iden.1.f: "After the National Day confusion several statesmen have gathered at our Capital to discuss the direction of our nation. First speaker is member of the [concept_dvg_panslavists] group. His name is Alexei Obolensky and he seeks to unite all Slavs under our rule. While Pan-Slavists have never been quite popular this professor in the Moscow Military University has gained enough support to pose a threat. \n\n Next speaker is our Minister of Education and Modernisation Pyotr Romanov-Trubetskoy representing the [concept_dvg_eurasians]. He proclaims that Russia can not be seen as an European nation and neither an Asian so we must create a new Eurasian Union for all people no matter their origin. \n\n The final speaker is our ruler [ROOT.GetCountry.GetRuler.GetFullName] who simply stated that we are all Russians and our current identity is good enough. Now we need to choose whose claim is truest..."
 dvg_rus_iden.1.a: "Maybe Obolensky has a right path for our future"
 dvg_rus_iden.1.b: "Romanov-Trubetskoy does have a romantic idea"
 dvg_rus_iden.1.c: "What is this nonsense, we are All Russians?"
 
 dvg_rus_iden.101.t: "Violence in the streets"
 dvg_rus_iden.101.d: "We have failed to create one distinct identity"
 dvg_rus_iden.101.f: "Children are crying, people are rioting, soldiers are deserting. Our nation is a mess and will soon collapse."
 dvg_rus_iden.101.a: "End is nigh..."
 
 dvg_rus_iden.102.t: "First United Tatar Congress"
 dvg_rus_iden.102.d: "Tatars have gathered today in Astrakhan to discuss their nation and culture"
 dvg_rus_iden.102.f: "During the congress several propositions were made including the dismantlement of our nation. This cannot be allowed and we must stop these terrorists before they act on their plans"
 dvg_rus_iden.102.a: "This can't be good"
 
 dvg_rus_iden.103.t: "United Turkic Front"
 dvg_rus_iden.103.d: "Worst has happended. The Turks are revolting against our actions."
 dvg_rus_iden.103.f: "[SCOPE.sCountry('scope_tar').GetName] has revolted against our rule and we must stop them before they gain international support."
 dvg_rus_iden.103.a: "God is with Russia"
 
 dvg_rus_iden.104.t: "Pamphlets spreading"
 dvg_rus_iden.104.desc: "Our national identity is cementing and people are picking their sides"
 dvg_rus_iden.104.f: "Today our national printing press has recieved three proposals. Panslavyane, Yevraziytsy and Obshcherussky want us to produce and spread their propaganda leaflets around the nation. Each side would greatly appreciate the act but we could always deny them and continue printing books and other literature for the people."
 dvg_rus_iden.104.a: "Promote Panslavyane"
 dvg_rus_iden.104.b: "Promote Yevraziytsy"
 dvg_rus_iden.104.c: "Promote Obshcherussky"
 dvg_rus_iden.104.d: "Support no one"
 
 dvg_rus_iden.105.t: "Identity rallies turn violent"
 dvg_rus_iden.105.desc: "Our national identity is cementing and people are picking their sides"
 dvg_rus_iden.105.f: "Today at one of our major cities the three sides were rallying. The rallies turned violent after heated arguments and now we must choose who to blame for these actions."
 dvg_rus_iden.105.a: "Arrest Panslavyane ulta-nationalist officer"
 dvg_rus_iden.105.b: "Arrest Yevraziytsy law student"
 dvg_rus_iden.105.c: "Arrest Obshcherussky Orthodox priest"
 dvg_rus_iden.105.d: "Arrest them all equally"
 
 dvg_rus_iden.106.t: "Silent night at Ilmen"
 dvg_rus_iden.106.d: "One hunt ends and one begins"
 dvg_rus_iden.106.f: "[ROOT.GetCountry.GetRuler.GetFullName] took a day off today by going hunting near lake Ilmen with [ROOT.GetCountry.GetRuler.GetAdjective] family. After the relaxing day he went to sleep at his hunting cabin. At around midnight unknown assailants entered the cabin and took shots at the [ROOT.GetCountry.GetRuler.GetTitle]. Bodyguards entered the room and saw that..."
 dvg_rus_iden.106.a: "Our [ROOT.GetCountry.GetRuler.GetFullName] and [ROOT.GetCountry.GetHeir.GetFullName] are shot dead"
 dvg_rus_iden.106.b: "Our [ROOT.GetCountry.GetRuler.GetFullName] and [ROOT.GetCountry.GetHeir.GetFullName] are shot but not fatally"
 
 dvg_rus_iden.107.t: "Morning comes"
 dvg_rus_iden.107.desc: "Sun has come up and things begin to clear"
 dvg_rus_iden.107.f: "In the morning our doctors and policemen were unable to identify the assailants. They decided that the assassins were...."
 dvg_rus_iden.107.a: "The assasins are notorius Panslavyane militants"
 dvg_rus_iden.107.b: "The assasins are notorius Yevraziytsy militants"
 dvg_rus_iden.107.c: "The assasins are notorius Obshcherussky militants"
 dvg_rus_iden.107.d: "The assasins are clearly Tatar nationalists"
 
 dvg_rus_iden.108.t: "Emergency council assembles"
 dvg_rus_iden.108.desc: "With the dead of our leader. Our course is uncertain."
 dvg_rus_iden.108.f: "After the tragedy at lake Ilmen our future is uncertain as the current goverment lacks legitimacy in the eyes of the people. We have four choices: let Obolensky or Romanov-Trubetskoy act as the temporary leader, call elections or stay with the current leadership that will certainly cause unrest."
 dvg_rus_iden.108.a: "Let Romanov-Trubetskoy take charge for now"
 dvg_rus_iden.108.b: "Let Obolensky take charge for now"
 dvg_rus_iden.108.c: "Elections it is"
 dvg_rus_iden.108.d: "Current path is enough"
 
 dvg_rus_iden.109.t: "[GetMonth] protests"
 dvg_rus_iden.109.d: "People have gathered around [ROOT.GetCountry.GetCapital]"
 dvg_rus_iden.109.f: "Because of our actions and inability to cements our ideology the workers and farmers have began a protest. Unfotunately one of our policemen shot one of the protesters and the protest turned violent. They quickly overwhelmed the guards and now stand outside our national palace demanding reforms. We can promise them that, let our internal affairs divert them away or call in the army. Be in mind that we can only promise reforms once before the people radicalize for good."
 dvg_rus_iden.109.a: "The protesters take over [ROOT.GetCountry.GetCapital]"
 dvg_rus_iden.109.b: "Military takes control"
 dvg_rus_iden.109.c: "Promise them reforms"
 dvg_rus_iden.109.d: "Our internal forces can handle this"
 
 dvg_rus_iden.110.t: "Okhrana is enstablished"
 dvg_rus_iden.110.d: "New internal police force is formed"
 dvg_rus_iden.110.f: "Department for the Protection of Public Safety and Order or Okhrana (the Guard) has been formed today to combat internal troublemakers. As their first task they are sent to..."
 dvg_rus_iden.110.a: "Target internal dissidents"
 dvg_rus_iden.110.b: "Spy labour unions" 
 dvg_rus_iden.110.c: "Spy Tatars"
 
 dvg_rus_iden.111.t: "Natsgvardiya is enstablished"
 dvg_rus_iden.111.d: "New national guard is formed"
 dvg_rus_iden.111.f: "National Guard Troops Service of Russia or Natsgvardiya (National Guard) has been formed today to combat internal troublemakers. As their first task they are sent to..."
 dvg_rus_iden.111.a: "Target internal dissidents"
 dvg_rus_iden.111.b: "Target labour unions"
 dvg_rus_iden.111.c: "Target Tatars"
 
 dvg_rus_iden.112.t: "Mingar is enstablished"
 dvg_rus_iden.112.d: "New Ministry has is formed"
 dvg_rus_iden.112.f: "Ministry of Social Harmony or Mingar has been formed today to tackle internal troublemakers. As their first task they are sent to..."
 dvg_rus_iden.112.a: "Promote peace among the ideology debate"
 dvg_rus_iden.112.b: "Aid the poor and the sick"
 dvg_rus_iden.112.c: "Aid Tatars"
 
 dvg_rus_iden.113.t: "Opposing identity has cemented its support"
 dvg_rus_iden.113.d: "This can not be sustainable"
 dvg_rus_iden.113.f: "We have failed to contain opposing ideologies and now they have reached overwhelming popular support. If our ideology fails to gain support before the last one our nation will surely collapse."
 dvg_rus_iden.113.a: "We must catch on"
 dvg_rus_iden.113.b: "Clock strikes midnight..."
 
 dvg_rus_iden.200.t: "[SCOPE.sCountry('rus_intiator').GetName] proposes Pan-Slavic Unification"
 dvg_rus_iden.200.d: "We have a choice of uniting peacefully with our Slavic brethren"
 dvg_rus_iden.200.f: "A proposal arrived today about unification with our Slavic brethren. They propose we unify with them in exchange we gain considerable autonomy with our host."
 dvg_rus_iden.200.a: "For the sake of Slavs everywhere we must accept"
 dvg_rus_iden.200.b: "No"
 
 dvg_rus_iden.2.t: "New Constitution / Official Name"
 dvg_rus_iden.2.d: "The progress halts at the very first words"
 dvg_rus_iden.2.f: "As the writing started complaining started as well. "What is the name of our nation?". Romanov-Trubetskoy said: "Our nation is Eurasia, free and equal to all". \n\n Obolensky opposed this and said: "Russia is home to all Slavs and so Slavia is our name". \n\n Lastly [ROOT.GetCountry.GetRuler.GetFullName] stated that: "We are Russians now and forever and so All-Russia is our name" The council decides that..."
 dvg_rus_iden.2.a: ""Slavic union" does sound good"
 dvg_rus_iden.2.b: ""Eurasia" is almost poetic"
 dvg_rus_iden.2.c: ""All-Russia" is most reasonable choice"
 
 dvg_rus_iden.3.t: "New Constitution / Government type"
 dvg_rus_iden.3.d: "The progress halts at at the very next words"
 dvg_rus_iden.3.f: "Next step was addressing the goverment type of our constitution. Once again three major proposals hit the table. [concept_dvg_panslavists] proposed that our nation crowns a monarch in an official ceremony.\n\n While [concept_dvg_eurasians] are not exactly opposed to monarchs they still seek to have a leader chocen from them people so they proposed a full republic. \n\n [concept_dvg_allrussists] then proposed that current system works and we should continue it. The council decides..."
 dvg_rus_iden.3.a: "While old-fashioned, monarchy is the most reasonable choice"
 dvg_rus_iden.3.b: "No kings, we are nation of the people"
 dvg_rus_iden.3.c: "Why should we change from that works?"
 
 dvg_rus_iden.4.t: "New Constitution / Voting Rights"
 dvg_rus_iden.4.d: "The constitutional council has halted on voting laws"
 dvg_rus_iden.4.f: "Days went by without any problems because no one wanted to tackle the question of voting. As the debate began once again three proposals were present [concept_dvg_panslavists] proposed that only the wealthy and influenial should vote because we can't trust the poor. \n\n [concept_dvg_eurasians] shunned this elitist idea and stated that all the people should vote, but only if they knew what they were voting. In practise their proposal meant a test to vote. \n\n [concept_dvg_allrussists] once again denied both proposals and told that current system works best. The council decides..."
 dvg_rus_iden.4.a: "We can't let the toilers vote, but the wealthy and influential"
 dvg_rus_iden.4.b: "If you can complete the voters test you can vote"
 dvg_rus_iden.4.c: "Our current laws have kept most content and they will work in the future"
 
 dvg_rus_iden.5.t: "New Constitution / Citizenship and culture"
 dvg_rus_iden.5.d: "The constitutional council has progressed far but a new problem arises"
 dvg_rus_iden.5.f: "Weeks went by as the three sides argued over petty formalities and they finally hit a breaking point with Citizenship laws. Obolensky firmly stated that Slavs were the example of our Lords creation and for that reason only Slavs are real people. \n\n Romanov-Trubetskoy then angrily stated that all men were born equal and free so they are all Eurasian in their hearts. \n\n [ROOT.GetCountry.GetRuler.GetFullName] then offered a compromise of solidarity and harmony between all those who call themselves "All-Russian" and proposed a complitely new way to handle Citizenship. The council came to the conclusion that..."
 dvg_rus_iden.5.a: "Slavs are the superior people and everyone should know that"
 dvg_rus_iden.5.b: "Eurasia is much more than a name, it is an ideal of the mind and soul"
 dvg_rus_iden.5.c: "We are Russians and we accept them in all kinds and colors"
 
 dvg_rus_iden.6.t: "New Constitution / Religion"
 dvg_rus_iden.6.d: "The constitutional council has progressed once again but new problem arises"
 dvg_rus_iden.6.f: "As the Citizenship question came to and end a new problem quickly gained notoriety. Faith and Religious freedoms was the problem. [concept_dvg_panslavists] supported state Christianity with Orthodox and Catholic faiths working in harmony with their offspring. \n\n [concept_dvg_eurasians] once again stood firmly against such racist proposals and proposed total separation of church and state. \n\n [concept_dvg_allrussists] delegate then stated than Orthodoxy built this nation and it will guide us to the future. The council decides after a long day of debates that..."
 dvg_rus_iden.6.a: "Christianity is our core no matter where we come from"
 dvg_rus_iden.6.b: "We must love our neighbours in all of their creeds"
 dvg_rus_iden.6.c: "Orthodoxy is in our very soul"
 
 dvg_rus_iden.7.t: "New Constitution / Language and the rest"
 dvg_rus_iden.7.d: "The constitutional council has progressed once again but a single problem still baffles the council"
 dvg_rus_iden.7.f: "One of the last questions the council faced was the Russian language. Currently it is quite outdated with no words to most concepts that are present in the constitution. The council decided that Russian language needed some reforms. Surprisingly neither side had a clear proposal to this. In the end [concept_dvg_panslavists] radically proposed to create a new language with influence from all the Slavic languages in hopes of it being understandable to all Slavs. This however is heavy task and even the most ambitious linguist fears it. \n\n [concept_dvg_eurasians] stated that we should romanize the Russian language and reform it so that it will be easier for all of our Citizens to learn and read. \n\n [concept_dvg_allrussists] once again offered the most grounded solution that did not burden linguists. Russian language needed only reforms and modernisation with nothing else. In the end the council decided that..."
 dvg_rus_iden.7.a: "New united Slavic language combined form all of our languages"
 dvg_rus_iden.7.b: "Romanization is the future of equality and perseverance of the cyrilic script"
 dvg_rus_iden.7.c: "We must reform cyrillic script and writing"
 
 dvg_rus_iden.8.t: "New Constitution is written"
 dvg_rus_iden.8.desc: "The constitutional council has finished making the constituion and it is now being rewieved"
 dvg_rus_iden.8.f: "The constitution is now finished and being reviewed for final release. Wheater it is incoherent or clearly biased is now past us and the constitution is official. Each council member have reviewed the text and each came to the conclusion that..."
 dvg_rus_iden.8.a: "The constitution favors Panslavyane"
 dvg_rus_iden.8.b: "The constitution favors Yevraziytsy"
 dvg_rus_iden.8.c: "The constitution favors Obshcherussky"
 dvg_rus_iden.8.d: "Is this even Russian? What is this incoherent rambling?"