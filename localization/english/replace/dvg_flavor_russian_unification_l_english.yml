l_english:
  je_russian_unification:0 "Russian Unification"
  je_russian_unification_reason:0 "The time has come to make a decisive push for Russian unification. As one of the foremost Russian states, it is our duty to bring about this goal."
  dvg_propose_zemsky_sobor: "Propose to convene Zemsky Sobor and elect a Tzar"
  dvg_propose_zemsky_sobor_desc: "Time has come to put an end to the Smuta and begin a long road towards sovereign Russia. What was tried once or twice in the 16th century will work surely work this time." 
  je_zemsky_sobor: "Zemsky Sobor"
  je_zemsky_sobor_desc: "We have begun a council to elect a new Tzar for united Russia. Several sides are trying to gain the upper hand. Here is their power: \n\nLiberal Tzarists: #variable [Country.MakeScope.Var('dvg_zemsky_libtards').GetValue|+=]#!\nConservative Tzarists:#variable [Country.MakeScope.Var('dvg_zemsky_conservatives').GetValue|+=]#!\"Old Knyaz" Tzarists:#variable [Country.MakeScope.Var('dvg_zemsky_reactionaries').GetValue|+=]#!\n""

  dvg_russian_unification.2.t:0 "Confederation with [SCOPE.sCountry('russian_annex_country').GetName]"
  dvg_russian_unification.2.d:0 "As part of our efforts to unify the people of Russia, [SCOPE.sCountry('russian_annex_country').GetName] has agreed to join our growing confederation."
  dvg_russian_unification.2.f:0 ""By joining this confederation with [ROOT.GetCountry.GetName], we may be surrendering [SCOPE.sCountry('russian_annex_country').GetAdjectiveNoFormatting] sovereignty, but by doing so, we help to secure Russian sovereignty. The spirit of the times is undeniable; the Russian people desire unity, and the [ROOT.GetCountry.GetAdjectiveNoFormatting] seems set to be the ones to make it happen. To oppose the coming together of the Russian people would be utter folly.""
  dvg_russian_unification.2.a:0 "One step closer to unification!"
  dvg_russian_unification.2.b:0 "This is not in the interests of the state."
  
  dvg_russian_unification.3.t: "United Central Russia?"
  dvg_russian_unification.3.d: "All Central Russian nations recieved the same letter proposing to end centuries of separation"
  dvg_russian_unification.3.f: "The proposal states that all Central Russians should unite as one nation and then elect a new Tzar from the people. This unification would put an end to the Smuta and finally put us towards united Russia.\n Of course this means that our independence is lost, but Russia unites. However the one of the benefits of this proposal is that current ruler can choose a relative to be one of the candidates even if the rulers are not allowed in."
  dvg_russian_unification.3.a: "We accept"
  dvg_russian_unification.3.b: "We do not accept"
  
  dvg_russian_unification.31.t: "We are ready to begin the Zemsky Sobor"
  dvg_russian_unification.31.d: "Central Russian nations have accepted the prosal and are ready to unite and convene the Zemsky Sobor"
  dvg_russian_unification.31.f: "Zemsky Sobor will soon begin and all of the countries that accepted our proposal have already begun scheming to make sure they come out on top."
  dvg_russian_unification.31.a: "Troubles are hopefully soon over"
  
  dvg_russian_unification.310.t: "Zemsky Sobor of [GetDate.GetYear] gathers"
  dvg_russian_unification.310.d: "First days of Zemsky Sobor are here and three distinct sides have formed to lobby their agenda"
  dvg_russian_unification.310.f: "It was a rainy day in [ROOT.GetCapital.GetName]. Representatives from all of the constituent states have gathered to finally put an end to the Smuta and correcting the failures of Ivan III. From them three sides have formed with relatively similar ideas of how Russian Tzardom should be organised. \n First side is the Populists. They seek to reform Russia and at the same time elect a Tzar. Russians might describe them as "liberal" but they are more like progressive conservatives in more enlightened states like Scandinavia or Burgundy. \n Second side is the Conservatives. They are the moderates and seek to make Russia an united nation without putting much thought to reforming it. One of their more radical ideas is to kick out old dynasties and elect someone with the most merit. \n The third and last side represents the Old Dynasties of Russia. They are most reactionary and seek to make the Tzar the one and only authority of Russia. \n Now all that remains is the side we will support..."
  dvg_russian_unification.310.a: "We support the Populists"
  dvg_russian_unification.310.b: "We support the Conservatives"
  dvg_russian_unification.310.c: "We support the Old Dynasties"
  
  dvg_russian_unification.311.t: "Zemsky Sobor has its first debate"
  dvg_russian_unification.311.d: "First debate of Zemsky Sobor is here and the subject is the actual title"
  dvg_russian_unification.311.f: "First official debate of the Zemsky Sobor is about the title of our future ruler. The Populists hope to westernise Russia and propose that the official title would be "Emperor" or "Imperator" in Russian to sound more western. \n The other sides are clearly against this ideas since they are electing a Russian Tzar and not the Kaiser of Germany.\n The people of Russia do not actually care as long as they get a ruler."
  dvg_russian_unification.311.a: "Emperor sounds more western"
  dvg_russian_unification.311.b: "We are electing a Tzar and Tzar it is"
  
  dvg_russian_unification.312.t: "Second debate has hit the Zemsky Sobor"
  dvg_russian_unification.312.d: "Second debate of Zemsky Sobor is here and the subject is about blood"
  dvg_russian_unification.312.f: "Council has progressed with minor details and now second official debate of the Zemsky Sobor is about nobility. \n The Populists think that noble born requirement excludes many popular candidates. However nobility is not an exact science in Russia and most current nobles are nobles because they said so. \n Conservatives want someone with atleast some noble blood to give some legitimacy to the new Tzar.\n The Old Dynasties of course support only the purest of nobles and thus demand that the future Tzar must be a relative or member of powerful noble houses. \n  The people of Russia hope to gain a capable ruler regardless of noble blood."
  dvg_russian_unification.312.a: "Any Russian  will do"
  dvg_russian_unification.312.b: "Noble blood is required for candidacy"
  dvg_russian_unification.312.c: "Members and relatives of most well known noble houses are accepted"
  
  dvg_russian_unification.313.t: "Debate progresses to the third major issue of Zemsky Sobor"
  dvg_russian_unification.313.d: "Zemsky Sobor has once again progressed to an another milestone. This time about crowning seremony."
  dvg_russian_unification.313.f: "Council has progressed once again and now second official debate of the Zemsky Sobor is about who crowns the Tzar now and in the future. \n The Populists think that the first Statesman crowns the Tzar whether it is Prime Minister, Regent or any like those. This would symbolize the Tzars submission to the people of Russia and constitutional authority. \n Conservatives want a council of nobles to elect a representative to crown the Tzar. This would symbolize the Tzars submission to the nobles. \n The Old Dynasties want to preserve Orthodox values and support the Patriarch of Rus' as the crowner. This would symbolize the Tzars submission to traditional values and divine right. \n  The people of Russia once again do not really care as long as the matter is settled"
  dvg_russian_unification.313.a: "First Statesman crowns the Tzar"
  dvg_russian_unification.313.b: "Nobles can choose their representative"
  dvg_russian_unification.313.c: "Patriarch crowns the Tzar"
  
  dvg_russian_unification.314.t: "Debates progress to the fourth major issue of Zemsky Sobor"
  dvg_russian_unification.314.d: "Zemsky Sobor has once again progressed to an another milestone. This time about the nature of Russia."
  dvg_russian_unification.314.f: "Council has progressed once again and now third official debate of the Zemsky Sobor is about the structure of Russia and her constituent states. \n The Populists propose a federation of nations and peoples based on their cultures. This would greatly increase our legitimacy and ease bureaucracy but somewhat anger the landowners who now get new bosses. \n Conservatives surprisingly supported the Populist proposal but added that different minorities can have their states but make them titles like duchies, kingdoms etc. under the crown. The Populists and Conservatives thus agreed on this matter. \n The Old Dynasties made a counter proposal that Russia is one nation and is led from the [ROOT.GetCapital.GetName]. This would greatly increase our authority across the land but would anger the people. \n  The people of Russia surprisingly have expressed their concerns and prefer a federation over direct rule and will react accordinly."
  dvg_russian_unification.314.a: "Russia is federation of grand duchies, kingdoms and counties"
  dvg_russian_unification.314.b: "Russia is one nation under god"
  
  dvg_russian_unification.315.t: "One of the last debates progresses to Zemsky Sobor"
  dvg_russian_unification.315.d: "Zemsky Sobor is on its last debates. This debate is about the power of the Tzar and is of great importance"
  dvg_russian_unification.315.f: "Council has progressed once again and now one of the last official debates of the Zemsky Sobor is about the powers of Tzar and their government. \n The Populists as more liberal minded want to limit the powers of the Tzar. They propose that Tzar is a ruler without actual power. \n Conservatives once again agreed with limiting Tzars powers but wanted to retain some authority like choosing the government to prevent stagnation. In the end Russian people would still be in charge but Tzar could direct them. \n The Old Dynasties once again argued that Tzar is a symbol of Russia and has the divine right to rule. Thus Tzar would have the final say on all matters. \n  The people of Russia once again have expressed their concerns and prefer a Tzar with some power over have all of none at all."
  dvg_russian_unification.315.a: "Tzar is the a sovereign without power"
  dvg_russian_unification.315.b: "Tzar and his loyal council shall lead this nation"
  dvg_russian_unification.315.c: "Tzar has the final say on every national matter"
  
  dvg_russian_unification.316.t: "Zemsky Sobor is coming to an end"
  dvg_russian_unification.316.d: "Zemsky Sobor has now decided on all the matters that the representatives saw important but first the final speech before voting opens"
  dvg_russian_unification.316.f: "Council has now decided on all the matters before they can happily vote for a new Tzar. Before that several representatives gathered to give a symbolic final speech, but only one can actually give it. \n The Populists want to highlight Tzars unifying power to all Russians. \n Conservatives want to make a toast to Russia and the end to internal stagnation that started so long ago. \n The Old Dynasties want to wish good health and happiness to the future Tzar and Russia in general. \n  The people of Russia are eagerly awaiting the election results"
  dvg_russian_unification.316.a: "Populists preach unity for all Rus'"
  dvg_russian_unification.316.b: "Conservatives toast for a mighty Russia free from internal stagnation"
  dvg_russian_unification.316.c: "Old Dynasties wish good health and fortune to their future Tzar"
  
  dvg_russian_unification.320.t: "Voting begins"
  dvg_russian_unification.320.d: "Zemsky Sobor has officially concluded and voting has begun"
  dvg_russian_unification.320.f: "Voting has now opened as several candidates have for the whole year lobbied for support. The actual candidates depend on who had the most power during the Zemsky Sobor debates. \n The Populists put forth 3 candidates from the most merited people of Russia. These candidates represent the richest bankers, most educated professors and most talented artisans of Russia. \n Conservatives also put forth 3 candidates. The candidates represent the most influential Boyars, most devout clergymen and most wealthy capitalists of Russia  \n The Old Dynasties put forth candidates from all the families who joined us and thus their merits are meager but noble blood flows through them. \n  Voting will conclude in about a week. "
  dvg_russian_unification.320.a: "Dear Gentlemen, cast your votes"
  
  dvg_russian_unification.321.t: "Voting has now ended"
  dvg_russian_unification.321.d: "Zemsky Sobor has officially concluded and voting has ended"
  dvg_russian_unification.321.f: "Voting has now closed and now several parties are counting the votes to ensure legitimate results. In few hours all the votes were counted several times and the results state that the new Tzar will be..."
  dvg_russian_unification.321.a: "Rurikids of Repnin become the Tzar"
  dvg_russian_unification.321.b: "Belskies of Tver have most votes"
  dvg_russian_unification.321.c: "Brother of Vasily Kropotkin is chosen and Rurikids come to power once more"
  dvg_russian_unification.321.e: "Cousin of Pyotr Lyapunov comes to power"
  dvg_russian_unification.321.f: "The Tzar of the cities is chosen"
  dvg_russian_unification.321.g: "The labourer Tzar is chosen"
  dvg_russian_unification.321.h: "The candidate from Intelligentsia becomes the Tzar"
  dvg_russian_unification.321.i: "The Boyar canditate has them most votes"
  dvg_russian_unification.321.j: "The Orthdox Church gets their Tzar"
  dvg_russian_unification.321.k: "The Industrialist canditate has them most votes"
  
  
  dvg_russian_unification.4.t:0 "Russian Unification"
  dvg_russian_unification.4.d:0 "The tireless efforts of statesmen and soldiers has been rewarded; Russia is united into a single state."
  dvg_russian_unification.4.f:0 "Through blood and iron, through diplomacy and guile, Russia is united. It is a day of triumph and of reflection. However the future unfolds, the Russian state will surely play a leading role in deciding the fate of mankind."
  dvg_russian_unification.4.a:0 "All hail the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]."
  dvg_russian_unification.4.b:0 "This is a victory for the Russian people."
  dvg_russian_unification.10.t:0 "Novgorod Annexation"
  dvg_russian_unification.10.d:0 "The Cabal, which rules Novgorod, no longer controls anything other than the city itself and its nearest outskirts. "
  dvg_russian_unification.10.f:0 "Our monarch's closest advisers have suggested a great idea - if we offer the rulers of Novgorod nobility, large estates, and a decent pension, they might agree to recognize our authority. We will also make it clear to them that, if they refuse, a forceful intervention is imminent."
  dvg_russian_unification.10.a:0 "An Offer for Annexation"
  dvg_russian_unification.10.b:0 "This is not in the interests of the state."
  
  dvg_zemsky_libtards_tt: "{{color|red|Populists}} gain power"
  dvg_zemsky_conservatives_tt: "{{color|blue|Conservatives}} gain power"
  dvg_zemsky_reactionaries_tt: "{{color|green|Old Dynasties}} gain power"
  
  dvg_russia_royal_federation: "Sovereign Federation"
  dvg_russia_direct_rule: "Centralised State"